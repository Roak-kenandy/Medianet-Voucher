# Reference nginx config for the Medianet Voucher Portal.
# Copy the relevant parts into your real server block; adjust server_name, cert paths and root.
#
# Backend .env must match this setup:
#   TRUST_PROXY=loopback        (nginx on the same host; use the nginx IP/CIDR if it is elsewhere)
#   CORS_ORIGIN=https://portal.example.mv
#
# After deploying, confirm the backend sees real client IPs (no "client IP is loopback" warning in logs).

limit_req_zone $binary_remote_addr zone=portal_auth:10m rate=30r/m;

server {
    listen 80;
    server_name portal.example.mv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.example.mv;

    ssl_certificate     /etc/letsencrypt/live/portal.example.mv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.mv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # Largest legitimate upload is a 15 MB knowledge document.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Frontend build output (frontend/dist).
    root /var/www/medianet-voucher/frontend/dist;
    index index.html;

    # Never serve dotfiles, env files, source maps or backend private storage.
    location ~ /\.            { deny all; return 404; }
    location ~* \.(env|map|sql|log)$ { deny all; return 404; }
    location ^~ /private/     { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /api/auth/ {
        limit_req zone=portal_auth burst=20 nodelay;
        include /etc/nginx/snippets/medianet-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/medianet-proxy.conf;
    }

    # Public marketing images only; knowledge documents are served through authenticated API routes.
    location /uploads/marketing-ads/ {
        include /etc/nginx/snippets/medianet-proxy.conf;
    }

    location /uploads/ {
        return 404;
    }
}

# --- /etc/nginx/snippets/medianet-proxy.conf ---
# REQUIRED. Save the lines below (without the leading "# ") as that snippet file. Without the
# X-Forwarded-For line every client reaches the API as 127.0.0.1 and all per-client rate
# limits collapse into one shared bucket (the API logs a warning when it sees this).
# proxy_pass http://127.0.0.1:4000;
# proxy_http_version 1.1;
# proxy_set_header Host $host;
# # Overwrite (not append) so clients cannot spoof their IP for rate limiting.
# proxy_set_header X-Forwarded-For $remote_addr;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header Connection "";
# # Keep response buffering on (the default) so a slow reader stalls nginx, not a Node report slot.
# proxy_buffering on;
# # CRM calls can take up to CRM_REQUEST_TIMEOUT_MS; reports stream for a while.
# proxy_connect_timeout 10s;
# proxy_read_timeout 120s;
# proxy_send_timeout 120s;
